services:
  api:
    container_name: k019-api
    image: node:25
    working_dir: /app/api
    volumes:
      - ./api:/app/api
    ports:
      - 3000:3000
    command: sh -c "npm install && npm run start:dev"
    depends_on:
      db:
        condition: service_started
  db:
    container_name: portalWeb_db 
    image: postgres:15
    ports:
      - 4000:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portalDb
    volumes:
      - ./db:/var/lib/postgresql/data
    
      